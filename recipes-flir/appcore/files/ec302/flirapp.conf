[Unit]
After=connman.service systemd-journald.service progressapp.service videorender.service

[Service]
ExecStartPre=/bin/bash -c '/sbin/modprobe okeanos spi_verify_probe=1'
ExecStopPost=/bin/bash -c '/sbin/modprobe -r okeanos'
Environment=QT_QPA_EGLFS_FB=/dev/fb0
Environment=QT_LOGGING_RULES=qt.qml.connections=false
